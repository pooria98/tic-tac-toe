<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Tic Tac Toe</title>
  </head>
  <body>
    <h1 class="title">Tic Tac Toe</h1>

    <div class="game-mode-screen">
      <h2>Select Game Mode</h2>
      <div class="game-mode-buttons">
        <button class="player-vs-player">
          <span>Player</span><span>vs</span><span>Player</span>
        </button>
        <button class="player-vs-computer">
          <span>Player</span><span>vs</span><span>Computer</span>
        </button>
      </div>
    </div>

    <div class="game-play-screen">
      <p class="game-status"></p>
      <div class="board">
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
        <div class="cell"></div>
      </div>
      <div class="game-play-buttons">
        <button class="restart-button">Restart</button>
        <button class="game-mode-selection-button">Select Game Mode</button>
      </div>
    </div>
    <script src="main.ts"></script>
  </body>
</html>
